id: resurrection-with-tomb-and-four-soldiers
title: Resurrection of Christ with four soldiers
description: Christ steps out of a grey stone tomb towards the viewer, right hand raised in blessing and a long gold cross-staff with a trefoil cross in his left, wearing a red mantle lined green over his bare chest, fastened with a gold brooch. Four soldiers in grey plate armour surround the tomb, one slumped asleep at the left, one lying on the green grass below, one in a blue surcoat sitting with a halberd at the right and one crouching behind the tomb with hands raised. Cut from the inside of the initial; the background is transparent.
