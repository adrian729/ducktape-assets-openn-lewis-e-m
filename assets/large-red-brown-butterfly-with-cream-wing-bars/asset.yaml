id: large-red-brown-butterfly-with-cream-wing-bars
title: Large red-brown butterfly with cream wing bars
description: A large butterfly in profile facing left, its russet red-brown wings closed above the body and crossed by broad cream bars with rows of red and black spots along the margins; the body and the underside of the lower wing are pale blue-grey, with thin brown legs and two long clubbed antennae. Cut from the border of the historiated initial; the background is transparent.
