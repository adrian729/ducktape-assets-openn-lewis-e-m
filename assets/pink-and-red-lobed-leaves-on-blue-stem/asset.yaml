id: pink-and-red-lobed-leaves-on-blue-stem
title: Pink and dark red lobed leaves on a knotted blue stem
description: Two large curling lobed leaves, the left one rose-pink with white highlights and dotted lines, the right one dark red with gold-edged lobes and white highlights, meet over a small pink pod. A blue stem with a white centre line loops into a knot below them and ends at the bottom. Black outlines; transparent background.
