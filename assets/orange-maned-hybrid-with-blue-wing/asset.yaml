description: A hybrid creature facing right, with an orange-red beast head with pointed ears and open jaws on a gold-feathered neck and wing, a body curled into a large blue spiral with white hatching and a gold-dotted band, a bearded human face in orange-brown at its rump at the right, and two dark green clawed feet. Outlined in black; cut from the decorated initial, the background is transparent.
