# descriptive: find it and understand it
id: tall-floral-bar-with-knotted-red-blue-ribbons
title: Tall floral bar with red and blue strapwork knot
description: A tall vertical bar on a green and gold stem carrying, from top to bottom, blue and gold leaf curls, a large green, pink and gold acanthus fan over a blue and red leaf collar, a pink and gold star flower with a blue centre, a blue and gold acanthus scroll, a blue tulip-like flower, a gold and blue scroll, an interlaced red and blue strapwork lozenge over gold, a blue flower in gold leaves, a red bud and a pink tasselled flower at the foot. Gold discs and small blue and green gold-centred florets are scattered beside the stem. Opaque paint on a transparent ground.
