id: lamb-with-cross-and-ribbon
title: Agnus Dei, lamb lying with cross staff and banderole
description: A cream-white lamb lies with its legs folded, body to the right and head turned slightly towards the viewer, with pink ears and muzzle and dark hooves. A thin gold cross staff leans diagonally behind its head, and a blue-grey banderole with traces of lettering winds around the staff and flutters off to the right. Shaded in tan and grey; transparent background.
