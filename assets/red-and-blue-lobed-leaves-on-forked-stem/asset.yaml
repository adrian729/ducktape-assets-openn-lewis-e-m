title: Dark red and blue lobed leaves on a pale forked stem
description: Two curling lobed leaves joined by a pale pink forked stem with a black outline, a dark red leaf with orange and white highlights at the left and a blue leaf with white highlights at the right, with a small ribbed pod where they meet. The stem ends in a short fork at the bottom. Transparent background.
