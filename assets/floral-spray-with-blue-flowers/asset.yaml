# descriptive: find it and understand it
id: floral-spray-with-blue-flowers
title: Horizontal floral spray with blue flowers
description: A long horizontal spray of green, white-highlighted stems running from a blue acanthus curl with a pink-tan leaf at the left to a slender blue and gold leaf at the right, with a tuft of green grass at its centre. Along it hang two pale blue many-petalled flowers, green strap leaves, orange buds and gold discs, and small gold-centred blue florets and orange dots are scattered around the stems. Opaque paint on a transparent ground.
