# descriptive: find it and understand it
id: gold-blue-and-red-foliate-panel
title: Gold panel with blue star column and red and blue vines
description: A rectangular panel on a burnished gold ground, cut from a border.
  Gold bars with a blue stripe and red curled ends run along the top and bottom
  and extend into pointed gold finials at the four corners. A vertical blue
  column in the centre holds three squares, each filled with white radiating
  strokes around a central dot. On either side, curling red and blue stems carry
  three-lobed leaves in red, blue and green with white highlights and dots.
  Opaque within the panel; transparent outside.
