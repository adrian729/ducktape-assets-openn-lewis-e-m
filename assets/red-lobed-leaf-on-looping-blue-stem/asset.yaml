id: red-lobed-leaf-on-looping-blue-stem
title: Red lobed leaf on blue looped stem
description: A fat red-orange lobed leaf with white dots and gold-filled hollows, outlined in black, hangs below a blue and white striped stem that loops over itself and ends in a blunt curled tip at the right. The piece is cut straight along the lower right where it met the border bar. The background is transparent.
