title: King David playing the harp
description: King David, crowned in gold, with brown hair and beard, sits turned slightly to the right in a loose brown robe with an ermine-spotted collar and red pointed shoes, his right hand at the strings of a gold harp held at his side beside a small purple flower. He looks out at the viewer. Cut from the historiated initial; the background is transparent.
