# descriptive: find it and understand it
id: two-faced-alchemical-figure-and-dragon-scene
title: Crowned two-faced figure with dragon on rocky ground
description: An alchemical figure with two faces under one gold crown, a bearded profile looking left and a beardless one looking right, stands barefoot on green rocky ground in a robe gold and red on the left and black on the right, a gold feathered wing ending in a spiral coil at the left and a blue wing at the right, holding a chalice from which three green serpent heads rise. A green dragon lies on the ground biting a gold rod, and two seed-pod sprigs grow beside the figure, the left one faded. Cut from the miniature; the background is transparent.
