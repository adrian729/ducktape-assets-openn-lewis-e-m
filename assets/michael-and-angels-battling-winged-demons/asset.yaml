title: Saint Michael and angels fighting the dragon and demons
description: The figures of a miniature cut from their ground. Saint Michael in gold armour, with a halo and green, blue and red wings, stands at the centre with his sword raised and one foot on a brown winged dragon with a gold tail. Four angels in white, pink and red robes strike down with swords around him, while a red-clad demon with a bat wing falls at the left behind a blue shield with gold stars and a grey demon with blue bat wings sprawls at the lower right. Transparent background.
