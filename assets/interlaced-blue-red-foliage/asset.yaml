id: interlaced-blue-red-foliage
title: Interlaced blue and rose stems with lobed leaves
description: Two stems, one blue and one rose-red, each with a white centre line and black outline, loop through each other in a symmetrical knot of interlaced circles. Three-lobed leaves in orange, blue and rose sit inside the loops and at the centre, and larger lobed leaves in orange and blue spread from the four corners, all with white dots and highlights. Transparent background.
