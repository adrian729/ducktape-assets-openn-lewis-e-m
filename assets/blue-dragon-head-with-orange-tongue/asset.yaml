title: Blue dragon head with orange tongue
description: The head of a blue dragon in profile facing left, cut from the terminal of an initial. It has a pointed snout, a white-rimmed eye, a swept-back blue crest with white hatching and an open mouth with a dark red interior and white teeth, from which a long orange tongue curls out to the lower left. A short stub of neck remains at the right. Black outlines; transparent background.
