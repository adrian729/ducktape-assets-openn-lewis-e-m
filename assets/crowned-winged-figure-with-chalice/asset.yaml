id: crowned-winged-figure-with-chalice
title: Crowned two-faced winged figure with serpent chalice
description: A standing barefoot figure with two faces under one gold crown set with blue stones, a bearded profile looking left and a beardless one looking right. The long robe is gold and red on the left half and black on the right. A gold feathered wing spreads at the left, its lower part coiling into a spiral with a small head, and a blue wing with white drop markings spreads at the right. The right hand holds a dark gold-rimmed chalice from which three green serpent heads rise. Cut from the miniature; the background is transparent.
