id: gold-seed-pod-sprig
title: Faded sprig with gold seed pods
description: The remains of an upright sprig, a dark green stem with two curving side stalks and faint traces of about six gold and red seed pods around it, most of the paint lost so that the pods survive as scattered flakes without outlines. Cut from the ground of the miniature at the left of the figure; the background is transparent.
