id: inhabited-initial-s-with-winged-dragon
title: Inhabited initial S with a winged dragon
description: The letter S drawn as a rose-red band with white dots and a black outline, curling into a loop that encloses a blue winged dragon. The dragon's blue head with pointed ears faces right at the top right, an orange bat wing spreads across the centre, and its blue hind leg rests on the lower curve beside a blue and red lobed leaf. Red, blue and orange acanthus sprays with a small blue creature head grow from the left side of the letter. Transparent background.
