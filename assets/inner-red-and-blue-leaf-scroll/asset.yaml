# descriptive: find it and understand it
id: inner-red-and-blue-leaf-scroll
title: Red and blue leaf scroll panel
description: A dense panel of blue and red-orange leaf scrollwork outlined in black. Thin blue and red stems curl into two large spirals, one at the upper left and one at the lower right, and throw off lobed, trefoil and heart-shaped leaves in blue, red and orange with white dots and vein lines; an orange lobed terminal with a curled tip closes the top. The panel is roughly rectangular, its left and right sides cut straight where the scroll met the border bars. The background is transparent.
