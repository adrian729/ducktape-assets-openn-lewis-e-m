id: upper-trail-of-pointed-ivy-and-gold-flower
title: Upright ivy trail with gold flower, upper half
description: A thin pale pink stem with a black outline rises vertically and gives off short side stems to left and right. Pointed ivy leaves alternate along it in tan, red and blue, each drawn out into a long black hairline tip, and a round gold flower with black hairline rays sits to the left of the middle. Transparent background.
