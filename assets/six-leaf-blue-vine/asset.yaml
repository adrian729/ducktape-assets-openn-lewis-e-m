id: six-leaf-blue-vine
title: Blue vine with six lobed leaves
description: A blue stem with a white centre line and black outline curves down from a curled tip at the top left and branches to both sides. Six five-lobed pointed leaves hang from it, three orange-red, two blue and one green, each with white highlights and a line of white dots down the middle. Transparent background.
