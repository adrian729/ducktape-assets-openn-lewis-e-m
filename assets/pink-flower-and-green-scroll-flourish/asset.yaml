# descriptive: find it and understand it
id: pink-flower-and-green-scroll-flourish
title: Green scroll flourish with pink flowers and blue bead chain
description: A flourish from the lower part of an initial. A red bell-shaped flower with a blue calyx sits at the top right, a chain of blue beads tapering upward curves away from it to the upper left, and green curling leaves and stems spiral downward carrying three pink five-petal flowers, an orange curled leaf and a dark green pod, with a red beaded curl at the lower left. Darker outlines and white highlights; transparent background.
