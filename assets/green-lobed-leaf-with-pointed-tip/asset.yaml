title: Green lobed leaf with pointed tip
description: A broad dark green leaf with three rounded lobes above and a pointed lobe below, veined with pale brown-white strokes and outlined in black, with a few flecks of gold at the tips; a thin pale fringe remains along the outline where it was lifted from the blue stroke of the initial. The background is transparent.
