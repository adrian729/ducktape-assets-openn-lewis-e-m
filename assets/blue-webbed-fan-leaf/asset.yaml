title: Blue webbed fan leaf
description: A fan-shaped blue leaf spreading to the left from a narrow base at the right, its six pointed hooked tips joined by pale ribbed webbing like a bat's wing, with a tall curling tendril at the top and a pink-red lobe folded behind it at the upper right. Outlined in black on a transparent ground.
