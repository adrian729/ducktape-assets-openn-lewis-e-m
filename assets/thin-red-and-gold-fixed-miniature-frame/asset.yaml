title: Thin red and gold miniature frame
description: A thin rectangular frame, taller than wide, of pink-red paint with worn patches of gold leaf and a thin dark line along its inner edge; the four bands run slightly askew, the top band rising to the right and the left band leaning. Only the paint is opaque; the interior and everything outside the frame are transparent.
