# descriptive: find it and understand it
id: green-gold-leaf-and-flower-flourish
title: Gold and green leaf flourish with yellow flowers
description: A flourish from the upper left of an initial. A broad ochre-gold leaf curls into spirals at the top right and at the bottom, a green acanthus leaf fills the centre, a blue curled leaf sits at the lower right, and thin green stems with spiral tendrils and fern-like fronds spread outward. A spray of yellow bell-shaped flowers on green stems rises at the top, and a tapering red beaded curl extends to the left. Transparent background.
