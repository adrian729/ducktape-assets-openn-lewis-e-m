id: reclining-green-dragon-biting-gold-bar
title: Reclining green dragon biting a gold rod
description: A long green dragon with russet shading lies stretched out facing left, its jaws closed on a gold rectangular rod; it has a slender curved neck, small clawed forelegs, a dark feathered wing with a gold-brown underside raised over its back at the right and a tail trailing to the right. Cut from the ground of the miniature; the background is transparent.
