title: Two bell flowers and gold berry on black twig
description: Two scalloped bell-shaped flowers with orange-red petals and dark green calyces hang from a thick black stem, one above and one below, with a gold disc berry on a stalk at the left and thin black tendrils curling to the right. The stem runs off the lower edge. Black line and paint on a transparent ground.
