id: lobed-floral-blue-scroll
title: Blue S-curved vine with lobed leaves
description: A blue stem with a white centre line and black outline winds in an S-curve and branches into short side shoots. Six three-lobed leaves hang from it, two orange-red, two green and two blue, each with white highlights and a line of white dots along the centre. Transparent background.
