title: Gold acanthus spray with blue and pink leaves
description: A spray fanning out from a cut stem at the right; two gold and orange acanthus leaves with white vein lines reach left and upward, and below them a long pointed blue leaf with white highlights wraps around a pink lobe bearing a white circle and a small white sprig mark, with a short red stub hanging below. Cut from the decorated initial; the background is transparent.
