id: lower-curving-ivy-trail-with-gold-flower
title: Curving ivy trail with gold flower, lower half
description: A thin pale pink stem with a black outline curves from the upper left down to the lower right and gives off short side stems. Pointed ivy leaves alternate along it in red, blue and tan, each drawn out into a black hairline tip, and a round gold flower with black hairline rays hangs at the right end. Transparent background.
